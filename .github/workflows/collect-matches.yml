name: Coleta diária

# Por que diária, e não avulsa: a confiança do score é medida por
# (patch, elo, rota, campeão), e um patch dura ~14 dias (medido: 16.12=13d,
# 16.13=21d, 16.14=14d). Partida de patch encerrado não recupera mais aquela
# janela — se a coleta não acontecer durante a vida do patch, aquele patch
# nunca sai de "tier provisório". Ver Core/Estrutura_roadmap/17_ESTADO_IMPLEMENTADO.md
# §rodada 12.

on:
  schedule:
    # 06:00 UTC = 03:00 BRT, fora do horário de pico.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      puuid_limit:
        description: "Invocadores por divisão"
        required: false
        default: "100"

# Duas execuções simultâneas competiriam pela mesma cota da Riot e
# atrapalhariam uma à outra sem coletar mais nada.
concurrency:
  group: coleta
  cancel-in-progress: false

# Revisão técnica 09/08 §2.4: default do `GITHUB_TOKEN` da org pode ser
# `write` sem isso — ver mesma nota em backend-tests.yml. Este workflow
# em particular já tem acesso a segredos reais (chave Riot, banco), então
# limitar o escopo do token importa ainda mais aqui.
permissions:
  contents: read

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: backend
    env:
      RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PUUID_LIMIT: ${{ github.event.inputs.puuid_limit || '100' }}
      # Piloto de região (rodada 25): br1 continua sendo a única região com
      # coleta real até este lote — euw1 entra aqui e nos steps de ingestão
      # abaixo. Ver Core/Estrutura_roadmap/17_ESTADO_IMPLEMENTADO.md.
      PIPELINE_PLATFORM_REGIONS: "br1,euw1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # Divisões separadas porque o endpoint de League-V4 exige divisão
      # explícita. Todas gravam elo_tier="GOLD" — o balde é o mesmo, o que
      # a divisão faz é tornar a amostra representativa do ouro inteiro em
      # vez de só a divisão mais alta.
      - name: Coletar partidas BR1 (Gold I-IV)
        run: |
          for DIV in I II III IV; do
            echo "::group::BR1 Gold $DIV"
            python -m app.jobs.ingest_matches \
              --region br1 --tier GOLD --division "$DIV" \
              --puuid-limit "$PUUID_LIMIT" --matches-per-summoner 20
            echo "::endgroup::"
          done

      # Piloto EUW1 (rodada 25, filtro de região): step separado do BR1 em
      # vez de aninhar um segundo loop dentro do de cima — mais fácil de
      # triar log por região e de divergir parâmetros por região depois,
      # se precisar. Bucket de cota Match-V5 totalmente separado do BR1
      # (`americas` vs. `europe`), então isso roda em paralelo de cota real,
      # não compete pelo mesmo limite.
      - name: Coletar partidas EUW1 (Gold I-IV)
        run: |
          for DIV in I II III IV; do
            echo "::group::EUW1 Gold $DIV"
            python -m app.jobs.ingest_matches \
              --region euw1 --tier GOLD --division "$DIV" \
              --puuid-limit "$PUUID_LIMIT" --matches-per-summoner 20
            echo "::endgroup::"
          done

      # Kit não depende de partida, só do Data Dragon. Roda para a versão
      # mais recente porque é o patch que está ganhando dado agora; sem
      # isso, as linhas do patch corrente ficariam sem a Camada 2 (25% do
      # peso) e o peso seria redistribuído sem necessidade.
      #
      # continue-on-error: uma falha de rede transitória contra o Data
      # Dragon (já aconteceu: httpx.ConnectTimeout num runner do GitHub)
      # não pode travar o reprocessamento das partidas que a etapa anterior
      # já coletou com sucesso — a Camada 2 fica com o Kit do dia anterior
      # (não com dado nenhum), o resto do pipeline não fica pra trás.
      - name: Recalcular Camada 2 (Kit) do patch corrente
        continue-on-error: true
        run: python -m app.jobs.compute_kit

      # "Patch Notes" (o que a Riot mudou de verdade, não só impacto no
      # score): também só depende do Data Dragon, mesma justificativa do
      # Kit acima pro continue-on-error — não bloqueia o resto do
      # pipeline se o Data Dragon estiver instável.
      - name: Detectar mudanças reais do patch (Data Dragon diff)
        continue-on-error: true
        run: python -m app.jobs.compute_patch_changes

      # Matchups, Build recomendado e Skill Expression (rodada 21): os
      # três só dependem de match_participants/matches já ingeridos acima,
      # nenhum faz chamada à Riot (Build/Skill Expression só ao Data
      # Dragon pra resolver nome de campeão, mesma cota zero-custo do Kit).
      # continue-on-error pelo mesmo motivo dos outros estágios
      # independentes: uma falha aqui não pode travar o reprocessamento
      # do resto do pipeline.
      - name: Calcular matchups (campeão vs. campeão)
        continue-on-error: true
        run: python -m app.jobs.compute_matchups

      - name: Calcular build/runa recomendados
        continue-on-error: true
        run: python -m app.jobs.compute_build_recommendation

      - name: Calcular Skill Expression (floor/ceiling)
        continue-on-error: true
        run: python -m app.jobs.compute_skill_expression

      # Todos os estágios são delete-and-recompute, então rodar o pipeline
      # inteiro a cada coleta é idempotente e mantém o site em dia.
      - name: Reprocessar pipeline
        run: |
          python -m app.jobs.aggregate_stats
          python -m app.jobs.compute_baselines
          python -m app.jobs.compute_performance
          python -m app.jobs.compute_build
          python -m app.jobs.compute_meta
          python -m app.jobs.compute_scores

      # Política de retenção de PUUID (06_SEGURANCA_PRIVACIDADE.md §7, rodada
      # 18): zera o vínculo com o jogador passada a janela de coleta ativa.
      # Roda por último e não bloqueia o pipeline acima em caso de falha.
      - name: Expurgar PUUID fora da janela de retenção
        continue-on-error: true
        run: python -m app.jobs.purge_puuid

      # "Classificações" (rodada 19): ranking das ligas apex direto da
      # Riot, independente do pipeline de campeões acima — não bloqueia
      # nem é bloqueado por ele. Sequencial e rate-limited pela própria
      # RiotWatcher (150 chamadas Account-V1 pro top 50 de cada tier),
      # por isso demora minutos, não segundos.
      - name: Coletar ranking das ligas apex
        continue-on-error: true
        run: python -m app.jobs.collect_rankings
