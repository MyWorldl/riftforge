name: Backend tests

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  schedule:
    # Roda mesmo sem push novo, para pegar deprecações/mudanças de schema
    # que a Riot ou a Data Dragon possam introduzir do lado deles.
    - cron: "0 6 * * 1"

# Revisão técnica 09/08 §2.4: sem `permissions:` explícito, o
# `GITHUB_TOKEN` herda o default da organização — que pode ser `write`
# em conteúdo/packages/deployments. Um step comprometido (dependência de
# `pip install`, action de terceiro) ganharia permissão de escrita no
# repo de graça.
permissions:
  contents: read

jobs:
  # Revisão técnica §4.4: `ruff` nunca rodava em CI, só quem lembrasse de
  # rodar localmente pegava um erro de lint antes do merge.
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run ruff
        run: ruff check .

      # Sprint 2 item 13 (revisão técnica): CVE futura numa dependência de
      # produção passa a quebrar o CI em vez de só ser descoberta na próxima
      # revisão manual — mesmo espírito do `dependabot.yml` (abre PR), mas
      # com feedback imediato a cada push.
      - name: Audit de dependências (pip-audit)
        run: pip-audit -r requirements.txt

      # Sprint 6 (16/08): item que a revisão técnica §4.4 já tinha
      # registrado como "futuro, não fingido como feito" — 29 erros
      # pré-existentes espalhados em 15 arquivos (Row do SQLAlchemy,
      # Optional não tratado) não bloqueiam por decisão do usuário
      # (corrigir os 29 seria escopo bem maior que "adicionar ao CI",
      # tocando código de agregação já em produção sem necessidade). Roda
      # e reporta sempre — código novo que piorar o baseline aparece no
      # log, mesmo sem quebrar o build.
      - name: Checar tipos (mypy, não bloqueia)
        continue-on-error: true
        run: mypy app

  # Revisão técnica §1.5/§2.7: os testes de rede real (Riot API/Data
  # Dragon, marcados `integration`) saíram do job de todo push — deixavam o
  # CI instável por motivo alheio ao commit (chave expirando, Riot
  # instável), e expunham `RIOT_API_KEY` num contexto que não precisa dela
  # (princípio do menor privilégio). `unit` roda sempre, rápido, sem
  # segredo nenhum; `integration` só no cron semanal, com a chave.
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -q -m "not integration"

  integration:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run integration tests
        run: pytest -q -m integration
